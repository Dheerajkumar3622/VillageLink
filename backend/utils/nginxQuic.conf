# Nginx HTTP/3 and QUIC Reverse Proxy Configuration
events {
    worker_connections 1024;
}

http {
    upstream backend_nodes {
        server 127.0.0.1:5000;
    }

    server {
        # Listen on both standard TCP 443 and UDP HTTP/3 443
        listen 443 ssl;
        listen 443 http3 reuseport;

        server_name villagelink.in;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_certificate /etc/nginx/ssl/villagelink.crt;
        ssl_certificate_key /etc/nginx/ssl/villagelink.key;

        # Advertise HTTP/3 availability to clients supporting it
        add_header Alt-Svc 'h3=":443"; ma=86400';

        location / {
            proxy_pass http://backend_nodes;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
