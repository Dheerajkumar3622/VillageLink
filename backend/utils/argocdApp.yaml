apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: villagelink-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/Dheerajkumar3622/VillageLink'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: villagelink-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
