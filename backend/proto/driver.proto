syntax = "proto3";

package villagelink.telemetry;

// Schema for high-frequency driver location updates
message DriverLocationUpdate {
  string driver_id = 1;
  double latitude = 2;
  double longitude = 3;
  float speed = 4;
  float heading = 5;
  int64 timestamp = 6;
  string route_id = 7;
}

// Request payload for querying nearby drivers
message NearbyDriversRequest {
  double latitude = 1;
  double longitude = 2;
  float radius_km = 3;
  string vehicle_type = 4;
}

// Response payload listing nearby drivers
message NearbyDriversResponse {
  repeated DriverLocationUpdate drivers = 1;
}
