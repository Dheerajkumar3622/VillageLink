<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/hero-bus-icon.png" />
    <title>VillageLink - Consumer App</title>

    <!-- V5 Typography Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Performance Optimizations -->
    <link rel="preconnect" href="https://backendlink-0xjs.onrender.com" crossorigin>
    <link rel="dns-prefetch" href="https://backendlink-0xjs.onrender.com">

    <!-- Leaflet CSS (deferred) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" media="print"
        onload="this.media='all'">

    <!-- Critical CSS -->
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            font-family: Inter, system-ui, -apple-system, sans-serif;
            line-height: 1.5;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eff6ff 0%, #eef2ff 50%, #faf5ff 100%);
            color: #0f172a;
            overscroll-behavior-y: none;
            background-attachment: fixed;
        }

        .dark body,
        body.dark {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            color: #f8fafc;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .initial-loader {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            flex-direction: column;
            gap: 1rem;
        }

        .loader-logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #22c55e, #10b981);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.5rem;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .loader-text {
            font-size: 0.875rem;
            opacity: 0.6;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }
    </style>

    <!-- Main CSS -->
    <link rel="stylesheet" href="/index.css">

    <!-- Razorpay -->
    <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>

<body
    class="bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 dark:from-slate-900 dark:via-[#0f172a] dark:to-indigo-950 text-slate-900 dark:text-slate-50 transition-colors duration-500 min-h-screen">

    <div id="root">
        <!-- V5 APP SHELL (Zero Latency) -->
        <div class="w-full max-w-md mx-auto min-h-screen relative flex flex-col bg-slate-50 dark:bg-slate-900 border-x border-slate-200 dark:border-slate-800 overflow-hidden shadow-2xl">
            <!-- Header Skeleton -->
            <div class="h-[72px] flex items-center justify-between px-6 border-b border-slate-200/50 dark:border-slate-800/50 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md shrink-0 py-4">
                <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                <div class="w-24 h-6 rounded-full bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                <div class="flex gap-3">
                    <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                    <div class="w-8 h-8 rounded-full bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                </div>
            </div>
            
            <!-- Content Skeleton -->
            <div class="flex-1 p-6 space-y-6">
                 <div class="w-2/3 h-8 rounded-lg bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                 <div class="w-full h-40 rounded-[2rem] bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                 
                 <div class="grid grid-cols-2 gap-4">
                     <div class="w-full h-32 rounded-[1.5rem] bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                     <div class="w-full h-32 rounded-[1.5rem] bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
                 </div>
                 
                 <div class="w-full h-24 rounded-[1.5rem] bg-slate-200 dark:bg-slate-800 animate-pulse"></div>
            </div>

            <!-- Bottom Nav Skeleton -->
            <div class="h-[80px] flex items-center justify-around px-4 border-t border-slate-200/50 dark:border-slate-800/50 bg-white/95 dark:bg-slate-900/95 backdrop-blur-lg shrink-0 pb-safe">
                <div class="flex flex-col items-center gap-1"><div class="w-6 h-6 rounded-md bg-slate-200 dark:bg-slate-800 animate-pulse"></div></div>
                <div class="flex flex-col items-center gap-1"><div class="w-6 h-6 rounded-md bg-slate-200 dark:bg-slate-800 animate-pulse"></div></div>
                <div class="flex flex-col items-center gap-1 relative z-10"><div class="w-14 h-14 rounded-full bg-emerald-500/20 animate-pulse -mt-6 ring-4 ring-slate-50 dark:ring-slate-900"></div></div>
                <div class="flex flex-col items-center gap-1"><div class="w-6 h-6 rounded-md bg-slate-200 dark:bg-slate-800 animate-pulse"></div></div>
                <div class="flex flex-col items-center gap-1"><div class="w-6 h-6 rounded-md bg-slate-200 dark:bg-slate-800 animate-pulse"></div></div>
            </div>
        </div>
    </div>

    <!-- User App Bundle -->
    <script type="module" src="/user-main.tsx"></script>

    <!-- Dark mode early detection -->
    <script>
        (function () {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
            var meta = document.createElement('meta');
            meta.name = "theme-color";
            meta.content = "#22c55e";
            document.getElementsByTagName('head')[0].appendChild(meta);
        })();
    </script>
</body>

</html>
